<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <title>Test 2: Speed Arithmetic & Mental Math Sprint (Vestor Innovators)</title>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: #e2e8f0;
      --accent-color: #4f46e5;
      --accent-gradient: linear-gradient(135deg, #4f46e5, #06b6d4);
      --correct-bg: #ecfdf5;
      --correct-border: #10b981;
      --correct-text: #065f46;
      --wrong-bg: #fef2f2;
      --wrong-border: #ef4444;
      --wrong-text: #991b1b;
      --card-radius: 16px;
    }
    [data-theme="dark"] {
      --bg-primary: #0b0f19;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --border-color: #334155;
      --accent-color: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1, #38bdf8);
      --correct-bg: rgba(16, 185, 129, 0.15);
      --correct-border: #10b981;
      --correct-text: #6ee7b7;
      --wrong-bg: rgba(239, 68, 68, 0.15);
      --wrong-border: #ef4444;
      --wrong-text: #fca5a5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding-bottom: 50px;
    }
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-box { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; }
    .logo-img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; }
    .logo-text { font-size: 14px; font-weight: 800; color: var(--text-primary); }
    .back-link {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-color);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(79, 70, 229, 0.1);
    }
    .container { max-width: 680px; margin: 16px auto; padding: 0 16px; }
    .banner {
      background: var(--accent-gradient);
      color: white;
      padding: 16px;
      border-radius: var(--card-radius);
      margin-bottom: 16px;
      text-align: center;
    }
    .banner h1 { font-size: 18px; margin-bottom: 4px; }
    .banner p { font-size: 12.5px; opacity: 0.9; }
    .q-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 16px;
      margin-bottom: 14px;
    }
    .q-head { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 12px; font-weight: 700; color: var(--accent-color); }
    .q-text { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .opts { display: flex; flex-direction: column; gap: 8px; }
    .opt-btn {
      width: 100%; min-height: 46px; padding: 10px 14px;
      border: 1.5px solid var(--border-color); background: var(--bg-primary);
      color: var(--text-primary); border-radius: 10px; text-align: left;
      font-size: 14px; font-weight: 500; cursor: pointer; display: flex; justify-content: space-between;
    }
    .opt-btn.correct { background: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: var(--correct-text) !important; font-weight: 700; }
    .opt-btn.wrong { background: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: var(--wrong-text) !important; font-weight: 700; }
    .expl { margin-top: 10px; padding: 10px; background: rgba(79, 70, 229, 0.08); border-left: 3px solid var(--accent-color); border-radius: 8px; font-size: 12.5px; display: none; }
    .expl.show { display: block; }
  </style>
</head>
<body>
  <header class="header">
    <a href="../index.html" class="logo-box">
      <img src="../images/logo-2.jpeg" alt="Vestor Innovators Logo" class="logo-img" onerror="this.src='../images/logo-2.jpg'">
      <span class="logo-text">Vestor Innovators</span>
    </a>
    <a href="../index.html" class="back-link">⬅️ Main Portal</a>
  </header>
  <main class="container">
    <div class="banner">
      <h1>⚡ Test 2: Speed Arithmetic & Mental Math</h1>
      <p>Quick Practice Sprint • Instant Explanations</p>
    </div>
    <div id="quizContainer"></div>
  </main>
  <script>
    const questions = [
      { id: 1, q: "Calculate quickly: 45 × 11", opts: ["495", "485", "505", "475"], ans: 0, exp: "Mental math trick: separate 4 and 5, place their sum (4+5=9) in the middle: 495." },
      { id: 2, q: "What is 25% of 360?", opts: ["90", "80", "100", "75"], ans: 0, exp: "25% is one-quarter: 360 ÷ 4 = 90." },
      { id: 3, q: "Evaluate: 12 + 15 ÷ 3 - 2", opts: ["15", "17", "11", "9"], ans: 0, exp: "BODMAS: 15 ÷ 3 = 5; then 12 + 5 - 2 = 15." },
      { id: 4, q: "Square of 35 is:", opts: ["1225", "1125", "1325", "1250"], ans: 0, exp: "For numbers ending in 5: 3 × 4 = 12, append 25 to get 1225." },
      { id: 5, q: "Find average of 12, 18, and 30:", opts: ["20", "22", "18", "24"], ans: 0, exp: "Sum = 12 + 18 + 30 = 60; 60 ÷ 3 = 20." }
    ];
    const container = document.getElementById('quizContainer');
    questions.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'q-card';
      card.innerHTML = `
        <div class="q-head"><span>Question ${idx+1} of ${questions.length}</span><span>Speed Math</span></div>
        <div class="q-text">${item.q}</div>
        <div class="opts">
          ${item.opts.map((opt, oIdx) => `<button class="opt-btn" onclick="checkAnswer(this, ${item.ans === oIdx}, '${item.exp.replace(/'/g, "\\'")}')"><span>${opt}</span><span class="icon"></span></button>`).join('')}
        </div>
        <div class="expl"><strong>💡 Solution:</strong> ${item.exp}</div>
      `;
      container.appendChild(card);
    });
    function checkAnswer(btn, isCorrect, exp) {
      const card = btn.closest('.q-card');
      const allBtns = card.querySelectorAll('.opt-btn');
      allBtns.forEach(b => b.disabled = true);
      if (isCorrect) {
        btn.classList.add('correct');
        btn.querySelector('.icon').textContent = '✓';
      } else {
        btn.classList.add('wrong');
        btn.querySelector('.icon').textContent = '✗';
      }
      card.querySelector('.expl').classList.add('show');
    }
  </script>
</body>
</html>
